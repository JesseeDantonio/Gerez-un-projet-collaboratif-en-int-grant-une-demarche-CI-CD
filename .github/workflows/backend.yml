name: Backend CI
 
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "main" ]
    paths:
      - 'back/**'
 
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back
 
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean verify

  test:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetch all history for SonarQube analysis

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Build, Test and analyze
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: mvn clean verify sonar:sonar -Dsonar.projectKey=dylan-jessee-d-antonio_bob-app-back -Dsonar.organization=dylan-jessee-d-antonio -Dsonar.host.url=https://sonarcloud.io

    - name: JaCoCo coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage_backend
        path: ${{ github.workspace }}/back/target/site/jacoco

    - name: SonarQube Quality Gate check
      uses: SonarSource/sonarqube-quality-gate-action@master
      timeout-minutes: 5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        # On précise à l'action où Maven a généré le fichier de rapport de tâche
        scanMetadataReportFile: back/target/sonar/report-task.txt

  docker:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        docker build -t bob-app-back .
        docker tag bob-app-back ${{ secrets.DOCKERHUB_USERNAME }}/bob-app-back:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/bob-app-back:latest